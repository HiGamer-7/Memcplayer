name: Build MEMC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Platform Files
        run: flutter create --platforms=android .

      - name: Fix Plugin Compatibility, SDK Versions & Gradle Memory
        run: |
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties

          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                          buildTypes {
                              release {
                                  signingConfig signingConfigs.debug
                              }
                          }
                      }
                  }
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          jvmTarget = '17'
                      }
                  }
              }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMC-Player-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/*.apk
